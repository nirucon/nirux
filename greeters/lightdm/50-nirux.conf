# NIRUX owner: greeter appearance installed by nirux.
[greeter]
default-session=niruwm
background=/usr/share/nirux/greeter/login.png
user-background=false
theme-name=NIRU
icon-theme-name=Adwaita
font-name=DejaVu Sans 10
xft-antialias=true
xft-hintstyle=hintfull
xft-rgba=rgb
panel-position=top
position=50%,center 68%,center
# The GTK greeter panel cannot centre the clock between the host and session
# groups, and an off-centre clock looks like a layout bug. Leave it out.
indicators=~host;~spacer;~session;~power
