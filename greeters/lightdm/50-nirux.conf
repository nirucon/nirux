# NIRUX owner: greeter appearance installed by nirux.
[greeter]
default-session=niruwm
background=/usr/share/nirux/greeter/login.png
user-background=false
theme-name=NIRU
icon-theme-name=Adwaita
font-name=DejaVu Sans 10
xft-antialias=true
xft-hintstyle=hintfull
xft-rgba=rgb
panel-position=top
clock-format=%H:%M
position=50% 50%
indicators=~host;~spacer;~clock;~spacer;~session;~power
