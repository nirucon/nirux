name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh tests/integration.sh
      - name: Verify release identity
        run: |
          test "$(./nirux --version | awk '{print $2}')" = "${GITHUB_REF_NAME#v}"
          test "$(awk '$1 == "suite" {print $2}' manifest)" = "${GITHUB_REF_NAME#v}"
      - name: Verify pinned component assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for repo in niruwm nirubar niruscreensaver nirulock nirulauncher nirunotify nirushot niruwallpaper; do
            version=$(awk -v repo="$repo" '$1 == repo {print $2}' manifest)
            gh release view "v$version" -R "nirucon/$repo" --json assets --jq '.assets[].name' > /tmp/assets
            grep -qx "$repo" /tmp/assets
            grep -qx SHA256SUMS /tmp/assets
            case "$repo" in
              niruwm) grep -qx niruwm-session /tmp/assets ;;
              nirulock) for distro in arch debian void; do grep -qx "pam-$distro" /tmp/assets; done ;;
              # The launcher entry and its icon travel with the suite so they
              # cannot drift from the binary's version.
              niruwallpaper)
                grep -qx niruwallpaper.desktop /tmp/assets
                gh release download "v$version" -R "nirucon/niruwallpaper" -p niruwallpaper.desktop -O /tmp/niruwallpaper.desktop
                version=$(awk '$1 == "niruwallpaper" {print $2}' manifest)
                gh release download "v$version" -R "nirucon/niruwallpaper" -p niruwallpaper.png -O /tmp/niruwallpaper.png
                ;;
            esac
          done
      - name: Package wallpapers, terminal, greeters and power rule
        run: |
          # Only the default theme's wallpaper ships in the release. The other
          # nine themes are a ~311 MB optional set served by the project's
          # Nextcloud, so a release stays small and every update does not
          # re-download wallpapers the user may already have.
          tar -cJf nirux-wallpapers.tar.xz \
            wallpaper/nirux-wallpaper-noir-4k.png \
            wallpaper/nirux-wallpaper-noir-8k.png
          tar -cJf nirux-terminal.tar.xz terminal
          rm -rf integration-build
          mkdir -p integration-build/polkit
          cp -R greeters/. integration-build/
          cp polkit/49-nirux-power.rules integration-build/polkit/
          cp wallpaper/nirux-wallpaper-noir-4k.png integration-build/background.png
          tar -cJf nirux-integration.tar.xz -C integration-build .
      - run: |
          cp /tmp/niruwallpaper.desktop /tmp/niruwallpaper.png .
          sha256sum nirux manifest config.example.toml appearance.example.toml nirux-wallpapers.tar.xz nirux-terminal.tar.xz nirux-integration.tar.xz niruwallpaper.desktop niruwallpaper.png > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            nirux
            manifest
            config.example.toml
            appearance.example.toml
            nirux-wallpapers.tar.xz
            nirux-terminal.tar.xz
            nirux-integration.tar.xz
            niruwallpaper.desktop
            niruwallpaper.png
            SHA256SUMS
          make_latest: true
          generate_release_notes: true
