name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Shellcheck release scripts
        run: |
          sh -n nirux
          sh -n terminal/nirux-theme-hook
          for script in tests/*.sh; do sh -n "$script"; done
          shellcheck -S warning -s sh nirux tests/integration.sh tests/display-manager.sh tests/runtime-state.sh tests/config-smoke.sh tests/startx-smoke.sh tests/release-smoke.sh tests/browser-smoke.sh terminal/nirux-theme-hook
      - run: python3 tests/terminal-theme.py
      - run: sh tests/integration.sh
      - name: Verify release identity
        run: |
          test "$(./nirux --version | awk '{print $2}')" = "${GITHUB_REF_NAME#v}"
          test "$(awk '$1 == "suite" {print $2}' manifest)" = "${GITHUB_REF_NAME#v}"
      - name: Verify pinned component assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          test "$(awk '$1 == "schema" {print $2}' manifest)" = 1
          awk '$1 != "schema" && $1 != "suite" {print $1}' manifest | sort | uniq -d | tee /tmp/duplicates
          test ! -s /tmp/duplicates
          assets=/tmp/release-assets
          rm -rf "$assets"
          mkdir -p "$assets"
          while read -r repo version; do
            case "$repo" in
              schema|suite|nirux) continue ;;
            esac
            base="https://github.com/nirucon/$repo/releases/download/v$version"
            dir="$assets/$repo"
            mkdir -p "$dir"
            gh release view "v$version" -R "nirucon/$repo" --json assets --jq '.assets[].name' > "$dir/assets"
            grep -qx "$repo" "$dir/assets"
            grep -qx SHA256SUMS "$dir/assets"
            extra=
            case "$repo" in
              niruwm) extra="niructl niruidle niruwm-session niruclipboard nirugestured nirubar-version" ;;
              nirulock) extra="pam-arch pam-debian pam-void" ;;
              niruwallpaper) extra="niruwallpaper.desktop niruwallpaper.png" ;;
              nirudisplay) extra="nirudisplay.desktop nirudisplay.png" ;;
              niruthemeselector) extra="niruthemeselector.desktop niruthemeselector.png" ;;
            esac
            curl -fsSL --retry 3 "$base/SHA256SUMS" -o "$dir/SHA256SUMS"
            for asset in "$repo" $extra; do
              grep -qx "$asset" "$dir/assets"
              curl -fsSL --retry 3 "$base/$asset" -o "$dir/$asset"
              expected=$(awk -v n="$asset" '$2 == n {print $1}' "$dir/SHA256SUMS")
              test "${#expected}" = 64
              test "$(sha256sum "$dir/$asset" | cut -d' ' -f1)" = "$expected"
            done
            chmod +x "$dir/$repo"
            if [ -x "$dir/$repo" ]; then
              reported=$("$dir/$repo" --version 2>/dev/null | awk '{print $2}')
              test "$reported" = "$version" || {
                echo "$repo reports $reported, manifest pins $version"; exit 1;
              }
            fi
            if [ "$repo" = niruwm ]; then
              bar=$(cat "$dir/nirubar-version")
              test "$bar" = "$(awk '$1 == "nirubar" {print $2}' manifest)" || {
                echo "NIRUWM bundles NIRUBAR $bar but manifest pins another version"; exit 1;
              }
            fi
          done < <(awk '$1 != "schema" && $1 != "suite" {print $1, $2}' manifest)
      - name: Package wallpapers, terminal, greeters and power rule
        run: |
          # Only the default theme's wallpaper ships in the release. The other
          # nine themes are a ~311 MB optional set served by the project's
          # Nextcloud, so a release stays small and every update does not
          # re-download wallpapers the user may already have.
          tar -cJf nirux-wallpapers.tar.xz \
            wallpaper/nirux-wallpaper-noir-4k.png \
            wallpaper/nirux-wallpaper-noir-8k.png
          tar -cJf nirux-terminal.tar.xz terminal
          rm -rf integration-build
          mkdir -p integration-build/polkit
          cp -R greeters/. integration-build/
          cp polkit/49-nirux-power.rules integration-build/polkit/
          cp polkit/nirux-wifi integration-build/polkit/
          cp wallpaper/nirux-wallpaper-noir-4k.png integration-build/background.png
          tar -cJf nirux-integration.tar.xz -C integration-build .
      - run: |
          cp /tmp/release-assets/niruwallpaper/niruwallpaper.desktop /tmp/release-assets/niruwallpaper/niruwallpaper.png .
          cp /tmp/release-assets/nirudisplay/nirudisplay.desktop /tmp/release-assets/nirudisplay/nirudisplay.png .
          cp /tmp/release-assets/niruthemeselector/niruthemeselector.desktop /tmp/release-assets/niruthemeselector/niruthemeselector.png .
          sha256sum nirux manifest config.example.toml appearance.example.toml nirux-wallpapers.tar.xz nirux-terminal.tar.xz nirux-integration.tar.xz niruwallpaper.desktop niruwallpaper.png nirudisplay.desktop nirudisplay.png niruthemeselector.desktop niruthemeselector.png > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            nirux
            manifest
            config.example.toml
            appearance.example.toml
            nirux-wallpapers.tar.xz
            nirux-terminal.tar.xz
            nirux-integration.tar.xz
            niruwallpaper.desktop
            niruwallpaper.png
            nirudisplay.desktop
            nirudisplay.png
            niruthemeselector.desktop
            niruthemeselector.png
            SHA256SUMS
          make_latest: true
          generate_release_notes: true
