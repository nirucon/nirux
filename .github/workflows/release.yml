name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh tests/integration.sh
      - name: Verify release identity
        run: |
          test "$(./nirux --version | awk '{print $2}')" = "${GITHUB_REF_NAME#v}"
          test "$(awk '$1 == "suite" {print $2}' manifest)" = "${GITHUB_REF_NAME#v}"
      - name: Verify pinned component assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for repo in niruwm nirubar niruscreensaver nirulock nirulauncher nirunotify nirushot; do
            version=$(awk -v repo="$repo" '$1 == repo {print $2}' manifest)
            gh release view "v$version" -R "nirucon/$repo" --json assets --jq '.assets[].name' > /tmp/assets
            grep -qx "$repo" /tmp/assets
            grep -qx SHA256SUMS /tmp/assets
            case "$repo" in
              niruwm) grep -qx niruwm-session /tmp/assets ;;
              nirulock) for distro in arch debian void; do grep -qx "pam-$distro" /tmp/assets; done ;;
            esac
          done
      - name: Package wallpapers, terminal, greeters and power rule
        run: |
          tar -cJf nirux-wallpapers.tar.xz wallpaper/*.png
          tar -cJf nirux-terminal.tar.xz terminal
          rm -rf integration-build
          mkdir -p integration-build/polkit
          cp -R greeters/. integration-build/
          cp polkit/49-nirux-power.rules integration-build/polkit/
          cp wallpaper/nirux-wallpaper-noir-rooted-in-less-4k.png integration-build/background.png
          tar -cJf nirux-integration.tar.xz -C integration-build .
      - run: sha256sum nirux manifest config.example.toml appearance.example.toml nirux-wallpapers.tar.xz nirux-terminal.tar.xz nirux-integration.tar.xz > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            nirux
            manifest
            config.example.toml
            appearance.example.toml
            nirux-wallpapers.tar.xz
            nirux-terminal.tar.xz
            nirux-integration.tar.xz
            SHA256SUMS
          make_latest: true
          generate_release_notes: true
