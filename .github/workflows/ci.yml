name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh -n nirux && sh -n terminal/nirux-theme-hook && for script in tests/*.sh; do sh -n "$script"; done
      - run: docker run --rm -v "$PWD":/src:ro koalaman/shellcheck:stable -S warning -s sh /src/nirux /src/tests/integration.sh /src/tests/config-smoke.sh /src/tests/startx-smoke.sh /src/tests/release-smoke.sh /src/tests/browser-smoke.sh /src/terminal/nirux-theme-hook
      - run: sh tests/integration.sh
      - run: python3 tests/terminal-theme.py
  distros:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [debian:bookworm-slim, archlinux:base, voidlinux/voidlinux:latest]
    container:
      image: ${{ matrix.image }}
      options: --privileged
    steps:
      - name: Bootstrap
        shell: sh
        run: |
          case '${{ matrix.image }}' in
            debian*) apt-get update && apt-get install -y git ca-certificates curl xz-utils ;;
            arch*) pacman -Syu --noconfirm --needed git ca-certificates curl xz ;;
            void*)
              for directory in /etc/xbps.d /usr/share/xbps.d; do
                for config in "$directory"/*.conf; do
                  [ ! -f "$config" ] || sed -i 's#alpha.de.repo.voidlinux.org#repo-default.voidlinux.org#g' "$config"
                done
              done
              xbps-install -Suy xbps && xbps-install -Suy && xbps-install -Sy git ca-certificates curl xz
              ;;
          esac
      - uses: actions/checkout@v4
      - name: Regression tests with the distribution shell
        run: sh tests/integration.sh
      - name: Full vanilla dependency installation
        shell: sh
        run: |
          export HOME=/tmp/niru-home NIRUX_LIBRARY=1
          mkdir -p "$HOME"
          . ./nirux
          OS=$(distro); DM=startx; BROWSER_EFFECTIVE=helium
          export BROWSER_EFFECTIVE
          install_packages
          for command in startx Xorg xauth dbus-run-session kitty rofi; do command -v "$command"; done
      - name: Optional display managers exist
        shell: sh
        run: |
          case '${{ matrix.image }}' in
            debian*) apt-cache show sddm lightdm lightdm-gtk-greeter >/dev/null ;;
            arch*) pacman -Si sddm lightdm lightdm-gtk-greeter >/dev/null ;;
            void*) xbps-query -R sddm >/dev/null && xbps-query -R lightdm >/dev/null && xbps-query -R lightdm-gtk-greeter >/dev/null ;;
          esac
      - name: Startx and real release integration
        shell: sh
        run: |
          case '${{ matrix.image }}' in
            debian*) apt-get install -y --no-install-recommends xvfb ;;
            arch*) pacman -S --needed --noconfirm xorg-server-xvfb xorg-xwininfo ;;
            void*) xbps-install -Sy xorg-server-xvfb xwininfo ;;
          esac
          sh tests/release-smoke.sh
      - name: Normal-user Helium sandbox
        shell: sh
        run: |
          if [ "$(id -u)" = 0 ]; then
            case '${{ matrix.image }}' in
              debian*) apt-get install -y --no-install-recommends passwd ;;
              arch*) pacman -S --needed --noconfirm shadow ;;
              void*) xbps-install -Sy shadow ;;
            esac
            id nirutest >/dev/null 2>&1 || useradd -m -s /bin/sh nirutest
            if [ -w /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
              sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            fi
            chmod -R a+rX .
            su -s /bin/sh nirutest -c "cd '$PWD' && sh tests/browser-smoke.sh"
          else
            sh tests/browser-smoke.sh
          fi
